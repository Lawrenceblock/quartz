name: Deploy Quartz to GitHub Pages / Vercel

on:
  push:
    branches:
      - v5  # 对应你的分支名称，如果你的默认分支是 main，请改成 main

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      # 如果你后续想顺便用 GitHub Pages 托管，可以加上面这一段；
      # 如果主要靠 Vercel 托管，Actions 只要能成功跑完 npx quartz build 并在 public 目录生成静态页面即可。
